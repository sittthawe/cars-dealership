name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django dependencies
        run: pip install -r backend/django_service/requirements.txt
      - name: Install sentiment dependencies
        run: pip install -r backend/sentiment_service/requirements.txt
      - name: Compile Python sources
        run: python -m compileall backend/django_service backend/sentiment_service

  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install node-api dependencies
        run: npm install --prefix backend/node_api
      - name: Syntax check node-api
        run: node --check backend/node_api/server.js
      - name: Install frontend dependencies
        run: npm install --prefix frontend/react_app
      - name: Build frontend
        run: npm run --prefix frontend/react_app build
