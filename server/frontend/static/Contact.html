<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Cars Dealership</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">Cars Dealership</div>
    <nav class="navlinks">
      <a href="/">Home</a>
      <a href="./About.html">About Us</a>
      <a href="./Contact.html" class="active">Contact Us</a>
    </nav>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <div class="contact-layout">
      <section class="info-box">
        <h2>Head Office</h2>
        <p><strong>Address:</strong> 1200 Market Street, Chicago, IL 60601</p>
        <p><strong>Phone:</strong> +1 (800) 555-0199</p>
        <p><strong>General Support:</strong> support@carsdealership.com</p>
        <p><strong>Dealer Relations:</strong> dealers@carsdealership.com</p>
        <p><strong>Working Hours:</strong> Mon-Fri, 8:00 AM - 8:00 PM (CST)</p>
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=80" alt="Cars Dealership office" style="width:100%;border-radius:10px;margin-top:10px;" />
      </section>

      <section class="form-box">
        <h2>Send a Message</h2>
        <form>
          <input type="text" placeholder="Full Name" required />
          <input type="email" placeholder="Email Address" required />
          <input type="text" placeholder="Subject" required />
          <textarea rows="5" placeholder="Message" required></textarea>
          <button type="submit">Submit</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
