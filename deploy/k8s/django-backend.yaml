apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-backend
  template:
    metadata:
      labels:
        app: django-backend
    spec:
      containers:
        - name: django-backend
          image: your-registry/car-dealership-django:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DJANGO_SECRET_KEY
              value: dev-secret-key-change-me
            - name: DEBUG
              value: "1"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: NODE_API_BASE
              value: http://node-api:3001
            - name: SENTIMENT_API_BASE
              value: http://sentiment-service:5001
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: django-backend
spec:
  selector:
    app: django-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
