apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      containers:
        - name: node-api
          image: your-registry/car-dealership-node-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              value: mongodb://mongodb:27017/dealership
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: node-api
spec:
  selector:
    app: node-api
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
